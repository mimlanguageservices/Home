<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Writer</title>
<style>
  :root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mute:#6b7280;--line:#e2e5ea;--accent:#2f5bea;--ok:#15803d;
        --sp:#dc2626;--cs:#d97706;--sg:#2563eb;--ms:#15803d}
  @media (prefers-color-scheme:dark){:root{--bg:#12151c;--card:#1b2030;--ink:#e8ebf2;--mute:#97a0b3;--line:#2b3247;--accent:#6c8cff}}
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  h1{font-size:18px;margin:0;flex:1}
  button{font:inherit;padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button:disabled{opacity:.5;cursor:default}
  main{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:16px 20px;max-width:1100px;margin:auto}
  details{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
  summary{cursor:pointer;font-weight:600}
  label{display:block;margin:10px 0 4px;font-size:13px;color:var(--mute)}
  input,textarea,select{width:100%;font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
  textarea{resize:vertical}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.row>*{flex:1}
  .student{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
  .student h2{font-size:16px;margin:0 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .student h2 .btns{margin-left:auto;display:flex;gap:8px}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;font-weight:600}
  .l0{color:var(--sp)}.l1{color:var(--cs)}.l2{color:var(--sg)}.l3{color:var(--ms)}.lx{color:var(--mute)}
  .status{font-size:12px;color:var(--mute)}
  #msg{padding:0 20px;color:var(--mute)}
  .err{color:var(--sp)}
  .tbl td{padding:2px 6px 2px 0}.tbl input{padding:4px 8px}
</style>
</head>
<body>
<header>
  <h1>Quarterly Report Writer</h1>
  <button id="load" class="primary">Load from Google Sheet</button>
  <button id="genAll" disabled>Generate all</button>
  <button id="copyAll" disabled>Copy all</button>
  <button id="copySheet" disabled title="Click cell K2 (first Comment cell) in the sheet, then paste">Copy for Sheet column</button>
</header>
<div id="msg"></div>
<main>
  <details id="settings">
    <summary>Settings</summary>
    <div class="row">
      <div><label>Google Sheet URL</label><input id="sheetUrl"></div>
      <div><label>Claude API key (stored only in this browser)</label><input id="apiKey" type="password" placeholder="sk-ant-..."></div>
    </div>
    <div class="row">
      <div><label>Model</label><input id="model"></div>
      <div><label>Instructions cell</label><input id="instrCell" placeholder="M1"></div>
    </div>
    <label>Grade codes — one per line: <code>CODE, CODE2 = meaning</code> (put lowest first)</label>
    <textarea id="codes" rows="5"></textarea>
    <label>Extra instructions (used in addition to the sheet's instructions cell)</label>
    <textarea id="extra" rows="4"></textarea>
    <p class="status">Settings save automatically in this browser.</p>
  </details>
  <div id="list"></div>
</main>

<script>
const DEFAULTS = {
  sheetUrl: 'https://docs.google.com/spreadsheets/d/1XnVthyRwieWqRQL3g5sFuhArl0vbUligjKKOv4L4lsE/edit',
  model: 'claude-sonnet-5-5',
  instrCell: 'M1',
  codes: 'SPG, SP = Still in Progress (low grade)\nCSG, CS = Competent\nASG, SG = Advanced\nMSG, MS = Advanced (the highest grade)',
  extra: 'Write in English, 3-5 sentences, as a teacher writing a quarterly performance report. Refer to the student only by first name(s).'
};
const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem('rw_'+k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem('rw_'+k,v) }catch(e){} }
};
for (const k of ['sheetUrl','apiKey','model','instrCell','codes','extra']) {
  const el = $(k);
  el.value = store.get(k) ?? DEFAULTS[k] ?? '';
  el.addEventListener('input', () => store.set(k, el.value));
}

let students = [], standards = [], sheetInstr = '';

function parseCSV(t){
  const rows=[]; let r=[], c='', q=false;
  for (let i=0;i<t.length;i++){
    const ch=t[i];
    if (q){ if(ch=='"'){ if(t[i+1]=='"'){c+='"';i++} else q=false } else c+=ch }
    else if (ch=='"') q=true;
    else if (ch==',') { r.push(c); c='' }
    else if (ch=='\n' || ch=='\r'){ if(ch=='\r'&&t[i+1]=='\n') i++; r.push(c); c=''; rows.push(r); r=[] }
    else c+=ch;
  }
  if (c!==''||r.length){ r.push(c); rows.push(r) }
  return rows;
}
function cellToIdx(ref){
  const m = /^([A-Za-z]+)(\d+)$/.exec(ref.trim()); if(!m) return null;
  let col=0; for (const ch of m[1].toUpperCase()) col=col*26+ch.charCodeAt(0)-64;
  return {col:col-1,row:+m[2]-1};
}
function firstName(full){
  const part = full.includes(',') ? full.split(',').slice(1).join(',') : full;
  return part.trim().toLowerCase().replace(/(^|[\s-])(\p{L})/gu,(m,a,b)=>a+b.toUpperCase());
}
function codeMap(){
  const lines = $('codes').value.split('\n').map(s=>s.trim()).filter(Boolean);
  const map = {};
  lines.forEach((ln,i)=>{
    const [l,r] = ln.split('='); if(!r) return;
    const meaning = r.trim();
    l.split(',').forEach(c => map[c.trim().toUpperCase()] = {meaning, level:i});
  });
  return map;
}
function stdCode(h){ const m = /RS-[A-Z]+-[A-Z]+-\d+-\w+/.exec(h); return m ? m[0] : h.slice(0,20); }
function setMsg(t,err){ $('msg').innerHTML = err ? '<span class="err">'+t+'</span>' : t }

async function loadSheet(){
  const id = (/\/d\/([\w-]+)/.exec($('sheetUrl').value)||[])[1];
  if (!id) return setMsg('Check the Google Sheet URL.', true);
  setMsg('Loading…');
  try {
    const res = await fetch(`https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv`);
    if (!res.ok) throw new Error(res.status);
    const rows = parseCSV(await res.text());
    const header = rows[0] || [];
    const commentCol = header.findIndex(h => h.trim().toLowerCase()==='comment');
    const lastCol = commentCol>=0 ? commentCol : header.length;
    standards = [];
    for (let c=1;c<lastCol;c++) if (header[c] && header[c].trim()) standards.push({col:c, code:stdCode(header[c]), text:header[c].replace(/^Rochester Standards\s*/,'').trim()});
    const ic = cellToIdx($('instrCell').value || 'M1');
    sheetInstr = ic && rows[ic.row] ? (rows[ic.row][ic.col]||'').trim() : '';
    const old = Object.fromEntries(students.map(s=>[s.full,s.report]));
    students = rows.slice(1).filter(r => (r[0]||'').trim()).map(r => ({
      full:r[0].trim(), name:firstName(r[0]), row:r,
      report: (commentCol>=0 && r[commentCol]||'').trim() || old[r[0].trim()] || ''
    }));
    setMsg(`${students.length} student(s) and ${standards.length} standard(s) loaded. ` +
      (sheetInstr ? 'Instructions found in '+($('instrCell').value||'M1')+'.' : '<span class="err">'+($('instrCell').value||'M1')+' is empty — using the extra instructions from Settings only.</span>'));
    render();
  } catch(e){
    setMsg('Could not load the sheet. Make sure sharing is set to "Anyone with the link can view". ('+e.message+')', true);
  }
}

function render(){
  const map = codeMap();
  $('genAll').disabled = $('copyAll').disabled = $('copySheet').disabled = !students.length;
  $('list').innerHTML = '';
  students.forEach((s,i) => {
    const d = document.createElement('div'); d.className='student';
    const chips = standards.map(st => {
      const g = (s.row[st.col]||'').trim().toUpperCase(); if(!g) return '';
      const info = map[g]; return `<span class="chip l${info?info.level:'x'}" title="${st.text.replace(/"/g,'&quot;')}">${st.code.replace(/^RS-MS-/,'')}: ${g}</span>`;
    }).join('');
    d.innerHTML = `<h2>${s.name} <span class="status">${s.full}</span>
      <span class="btns"><button data-a="gen">Generate</button><button data-a="copy">Copy</button></span></h2>
      <div class="chips">${chips}</div>
      <textarea rows="5" placeholder="Report appears here…"></textarea>
      <div class="status"></div>`;
    const ta = d.querySelector('textarea'); ta.value = s.report;
    ta.addEventListener('input', () => s.report = ta.value);
    d.querySelector('[data-a=gen]').onclick = () => generate(i);
    d.querySelector('[data-a=copy]').onclick = () => navigator.clipboard.writeText(ta.value).then(()=>d.querySelector('.status:last-child').textContent='Copied.');
    s.el = d; $('list').appendChild(d);
  });
}

function buildPrompt(s){
  const map = codeMap();
  const lines = standards.map(st => {
    const g = (s.row[st.col]||'').trim().toUpperCase(); if(!g) return null;
    const info = map[g];
    return `- ${st.code}: ${st.text}\n  Grade: ${g}${info?' = '+info.meaning:''}`;
  }).filter(Boolean);
  const scale = $('codes').value.trim();
  return `Student first name: ${s.name}\n\nGrade scale (lowest to highest):\n${scale}\n\nGraded standards this quarter (standards with no grade were not assessed and must not be mentioned):\n${lines.join('\n')}\n\nWrite the quarterly report comment for ${s.name}.`;
}
function systemPrompt(){
  return `You write quarterly school performance reports for a teacher.\n\nTeacher's instructions from the spreadsheet:\n${sheetInstr || '(none)'}\n\nAdditional instructions:\n${$('extra').value.trim() || '(none)'}\n\nAlways refer to the student only by the first name given. Output only the report text, with no preamble, headings or quotation marks.`;
}

async function generate(i){
  const s = students[i], st = s.el.querySelector('.status:last-child'), btn = s.el.querySelector('[data-a=gen]');
  const key = $('apiKey').value.trim();
  if (!key){ $('settings').open = true; return setMsg('Enter your Claude API key in Settings.', true) }
  btn.disabled = true; st.textContent = 'Writing…';
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'content-type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({model:$('model').value.trim(), max_tokens:800, system:systemPrompt(), messages:[{role:'user',content:buildPrompt(s)}]})
    });
    const j = await res.json();
    if (!res.ok) throw new Error(j.error?.message || res.status);
    s.report = j.content.map(b=>b.text||'').join('').trim();
    s.el.querySelector('textarea').value = s.report; st.textContent = 'Done — edit if you like.';
  } catch(e){ st.innerHTML = '<span class="err">'+e.message+'</span>' }
  btn.disabled = false;
}

$('load').onclick = loadSheet;
$('genAll').onclick = async () => { $('genAll').disabled = true; for (let i=0;i<students.length;i++) await generate(i); $('genAll').disabled = false };
$('copyAll').onclick = () => navigator.clipboard.writeText(students.map(s=>s.name+'\n'+s.report).join('\n\n')).then(()=>setMsg('All reports copied.'));
$('copySheet').onclick = () => navigator.clipboard.writeText(students.map(s => '"' + s.report.replace(/"/g,'""') + '"').join('\n')).then(()=>setMsg('Copied. In the sheet, click the first Comment cell (K2) and press Ctrl+V.'));
</script>
</body>
</html>
