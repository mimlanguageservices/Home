<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TOEFL Junior Practice - Rochester</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { height: 100%; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #2d3748; -webkit-text-size-adjust: 100%; overscroll-behavior: none; }
        .app { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
        .topbar { flex: 0 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px max(20px, env(safe-area-inset-right)) 10px max(20px, env(safe-area-inset-left)); background: rgba(255,255,255,0.96); box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .back { min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 12px; background: #eef2ff; color: #4c51bf; font-weight: 600; text-decoration: none; touch-action: manipulation; }
        .topbar h1 { font-size: 1.15rem; font-weight: 700; text-align: center; }
        .score { font-weight: 600; color: #4c51bf; min-width: 110px; text-align: right; font-size: 0.95rem; font-variant-numeric: tabular-nums; }
        .score.low { color: #e53e3e; }
        .tabs { flex: 0 0 auto; display: flex; gap: 8px; overflow-x: auto; padding: 12px max(16px, env(safe-area-inset-left)); -webkit-overflow-scrolling: touch; }
        .tab { flex: 0 0 auto; min-height: 44px; padding: 0 16px; border: 0; border-radius: 22px; background: rgba(255,255,255,0.25); color: #fff; font: 600 0.95rem inherit; font-family: inherit; touch-action: manipulation; cursor: pointer; white-space: nowrap; }
        .tab.active { background: #fff; color: #4c51bf; }
        .tab .mark { margin-left: 6px; font-size: 0.8rem; opacity: 0.9; }
        .stage { flex: 1; min-height: 0; display: flex; gap: 16px; padding: 0 max(16px, env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
        .pane { flex: 1; min-width: 0; background: #fff; border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); padding: 24px; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior-y: contain; }
        .passage h2 { font-size: 1.4rem; margin-bottom: 4px; }
        .kind { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: #818cf8; margin-bottom: 14px; }
        .passage p { line-height: 1.75; margin-bottom: 14px; font-size: 1.05rem; }
        .passage .gap { display: inline-block; min-width: 2.2em; text-align: center; padding: 0 6px; background: #eef2ff; border-radius: 6px; font-weight: 700; color: #4c51bf; }
        .qtype { display: inline-block; font-size: 0.75rem; font-weight: 600; padding: 2px 10px; border-radius: 10px; background: #eef2ff; color: #4c51bf; margin-bottom: 6px; }
        .q { margin-bottom: 26px; }
        .q-text { font-weight: 600; font-size: 1.08rem; margin-bottom: 8px; line-height: 1.4; }
        .opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; margin: 8px 0; padding: 10px 14px; border: 2px solid #e2e8f0; border-radius: 14px; background: #fff; color: inherit; font: 500 1rem inherit; font-family: inherit; text-align: left; touch-action: manipulation; cursor: pointer; }
        .opt .letter { flex: 0 0 32px; height: 32px; border-radius: 50%; background: #eef2ff; color: #4c51bf; display: flex; align-items: center; justify-content: center; font-weight: 700; }
        .opt.sel { border-color: #667eea; background: #f5f7ff; }
        .opt.right { border-color: #38a169; background: #f0fff4; }
        .opt.right .letter { background: #38a169; color: #fff; }
        .opt.wrong { border-color: #e53e3e; background: #fff5f5; }
        .opt.wrong .letter { background: #e53e3e; color: #fff; }
        .opt[disabled] { cursor: default; }
        .why { margin-top: 8px; padding: 10px 14px; border-radius: 12px; background: #fffbea; color: #744210; font-size: 0.95rem; line-height: 1.5; }
        .result { text-align: center; padding: 18px 10px; border-radius: 16px; background: #f5f7ff; margin-bottom: 16px; }
        .result strong { display: block; font-size: 2.4rem; color: #4c51bf; }
        .btn { min-height: 52px; margin-top: 14px; padding: 0 24px; border: 0; border-radius: 14px; font: 600 1rem inherit; font-family: inherit; touch-action: manipulation; cursor: pointer; background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
        .btn.ghost { background: #eef2ff; color: #4c51bf; margin-right: 8px; }
        .info { padding: 14px 16px; border-radius: 14px; background: #f5f7ff; line-height: 1.6; margin-bottom: 14px; }
        @media (max-width: 900px), (orientation: portrait) {
            .stage { flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; }
            .pane { flex: 0 0 auto; overflow: visible; padding: 18px; }
            .topbar h1 { font-size: 1rem; }
        }
    </style>
</head>
<body>
<div class="app">
    <div class="topbar">
        <a class="back" href="TOEFL-Junior-Prep.html">&#8592; Back</a>
        <h1 id="title">Practice</h1>
        <div class="score" id="score"></div>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="stage" id="stage"></div>
</div>

<script src="data/badges.js"></script>
<script src="data/reading-data.js"></script>
<script src="data/reading-data-2.js"></script>
<script src="data/reading-data-3.js"></script>
<script src="data/reading-data-4.js"></script>
<script src="data/reading-data-5.js"></script>
<script src="data/load-book.js"></script>
<script src="data/language-data.js"></script>
<script>
    const params = new URLSearchParams(location.search);
    const mod = params.get('m') === 'language' ? 'language' : 'reading';
    const testNo = mod === 'reading' ? params.get('test') : null;          // 1 or 2 = timed full reading test
const testMode = /^\d+$/.test(testNo || '');
const tnum = s => s.t || (s.test ? 1 : s.test2 ? 2 : s.test3 ? 3 : 0);   // which timed test a text belongs to (0 = practice)
    const TEST_MINUTES = 50;
    const all = mod === 'reading' ? window.PRACTICE_READING.filter(s => testMode || !tnum(s)) : window.PRACTICE_LANGUAGE.filter(s => !s.text);
    const sets = testMode ? all.filter(s => tnum(s) === +testNo) : all;
    document.getElementById('title').textContent = testMode ? 'Timed Reading Test ' + testNo : (mod === 'reading' ? 'Reading Comprehension' : 'Language: Skill Drills');
    document.title = document.getElementById('title').textContent + ' - TOEFL Junior';

    const PKEY = 'tj_progress';
    function loadProgress() { try { return JSON.parse(localStorage.getItem(PKEY)) || {}; } catch (e) { return {}; } }
    function saveScore(key, c, t) {
        try { const p = loadProgress(); if (!p[key] || c >= p[key].c) p[key] = { c, t }; localStorage.setItem(PKEY, JSON.stringify(p)); } catch (e) {}
    }

    sets.forEach(s => { s.items_ = () => s.questions || s.items; });
    const state = {};
    sets.forEach(s => state[s.id] = { answers: {}, saved: false });
    let cur = Math.max(0, sets.findIndex(s => s.id === params.get('set')));
    let started = !testMode, submitted = false, secondsLeft = TEST_MINUTES * 60, timerId = null;
    const L = 'ABCD';

    const feedbackOn = () => !testMode || submitted;
    const done = s => Object.keys(state[s.id].answers).length === s.items_().length;
    const correct = s => s.items_().filter((q, i) => state[s.id].answers[i] === q.a).length;
    const totalQ = () => sets.reduce((n, s) => n + s.items_().length, 0);
    const totalCorrect = () => sets.reduce((n, s) => n + correct(s), 0);
    const totalAnswered = () => sets.reduce((n, s) => n + Object.keys(state[s.id].answers).length, 0);
    const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');

    function renderTabs() {
        const prog = loadProgress();
        const el = document.getElementById('tabs'); el.innerHTML = '';
        sets.forEach((s, i) => {
            const b = document.createElement('button');
            b.className = 'tab' + (i === cur ? ' active' : '');
            let mark = '';
            if (testMode) mark = `<span class="mark">${Object.keys(state[s.id].answers).length}/${s.items_().length}</span>`;
            else { const best = prog[mod + ':' + s.id]; if (best) mark = `<span class="mark">${best.c}/${best.t}</span>`; }
            b.innerHTML = s.title + mark;
            b.onclick = () => { cur = i; render(); };
            el.appendChild(b);
        });
        const sc = document.getElementById('score');
        if (testMode && started && !submitted) sc.textContent = fmt(Math.max(0, secondsLeft));
        else if (testMode && !submitted) sc.textContent = '';
        else sc.textContent = totalCorrect() + ' correct';
    }

    function renderText(s) {
        const head = `<h2>${s.title}</h2><div class="kind">${s.kind} &middot; ${s.level}</div>`;
        if (mod === 'reading') return head + s.text.map(p => `<p>${p}</p>`).join('');
        return head + '<p style="color:#4a5568">Choose the word or phrase that best completes each sentence.</p>';
    }

    function render() {
        const stage = document.getElementById('stage');
        if (testMode && !started) {
            stage.innerHTML = `<div class="pane"><h2>Timed Reading Test ${testNo}</h2><div class="kind">${sets.length} texts &middot; ${totalQ()} questions &middot; ${TEST_MINUTES} minutes</div>
                <div class="info">Read each text and answer the questions. You can move between texts and change your answers. You will see your score and explanations after you submit. The clock starts when you press Start.</div>
                <button class="btn" id="startTest">Start test</button></div>`;
            document.getElementById('startTest').onclick = startTest;
            renderTabs(); return;
        }
        const s = sets[cur], st = state[s.id], items = s.items_(), fb = feedbackOn();
        const hasText = mod === 'reading';
        let q = '';
        if (testMode && submitted && cur === 0 && !st.shownTop) {}
        if (testMode && submitted) q += `<div class="result"><div>Your test score</div><strong>${totalCorrect()} / ${totalQ()}</strong>${tjBadgeHtml(totalCorrect(), totalQ())}<div>Review each text to see explanations.</div></div>`;
        items.forEach((it, i) => {
            const ch = st.answers[i];
            q += `<div class="q">${it.type ? `<span class="qtype">${it.type}</span>` : ''}<div class="q-text">${i + 1}. ${it.q.replace(/____/g, '&#95;&#95;&#95;&#95;&#95;')}</div>`;
            it.o.forEach((o, j) => {
                let cls = 'opt';
                if (fb && ch !== undefined) { if (j === it.a) cls += ' right'; else if (j === ch) cls += ' wrong'; }
                else if (ch === j) cls += ' sel';
                const locked = fb && ch !== undefined;
                q += `<button class="${cls}" data-i="${i}" data-j="${j}" ${locked ? 'disabled' : ''}><span class="letter">${L[j]}</span><span>${o}</span></button>`;
            });
            if (fb && ch !== undefined) q += `<div class="why">${ch === it.a ? 'Correct! ' : 'Not quite. '}${it.why || ''}</div>`;
            q += '</div>';
        });
        if (!testMode && done(s)) {
            const c = correct(s), t = items.length;
            if (!st.saved) { saveScore(mod + ':' + s.id, c, t); st.saved = true; }
            q += `<div class="result"><div>Set score</div><strong>${c} / ${t}</strong><div>${c === t ? 'Perfect!' : c >= t * 0.7 ? 'Good work. Review the explanations for any misses.' : 'Keep practicing. Read the explanations and try again.'}</div>
                <button class="btn ghost" id="retry">Try again</button>${cur < sets.length - 1 ? '<button class="btn" id="nextSet">Next set &#8594;</button>' : ''}</div>`;
        }
        if (testMode && !submitted) {
            q += `<div style="display:flex;gap:10px;flex-wrap:wrap">${cur > 0 ? '<button class="btn ghost" id="prevT">&#8592; Previous text</button>' : ''}${cur < sets.length - 1 ? '<button class="btn" id="nextT">Next text &#8594;</button>' : ''}${cur === sets.length - 1 ? '<button class="btn" id="submitT" style="margin-left:auto">Submit test</button>' : ""}</div>`;
        }
        stage.innerHTML = `<div class="pane passage" id="leftPane">${renderText(s)}</div><div class="pane" id="rightPane">${q}</div>`;
        stage.querySelectorAll('.opt').forEach(b => b.onclick = () => {
            const rp = document.getElementById('rightPane'), top = rp.scrollTop, sTop = stage.scrollTop;
            st.answers[+b.dataset.i] = +b.dataset.j;
            render();
            document.getElementById('rightPane').scrollTop = top;
            document.getElementById('stage').scrollTop = sTop;
        });
        const bind = (id, fn) => { const e = document.getElementById(id); if (e) e.onclick = fn; };
        bind('retry', () => { state[s.id] = { answers: {}, saved: false }; render(); });
        bind('nextSet', () => { cur++; render(); });
        bind('prevT', () => { cur--; render(); });
        bind('nextT', () => { cur++; render(); });
        bind('submitT', () => { const un = totalQ() - totalAnswered(); if (!un || confirm(un + ' question(s) unanswered. Submit anyway?')) submit(); });
        renderTabs();
    }

    function startTest() {
        started = true;
        timerId = setInterval(() => {
            secondsLeft--;
            const sc = document.getElementById('score'); sc.textContent = fmt(Math.max(0, secondsLeft)); sc.classList.toggle('low', secondsLeft <= 300);
            if (secondsLeft <= 0) submit();
        }, 1000);
        render();
    }
    function submit() {
        if (submitted) return;
        submitted = true; clearInterval(timerId);
        saveScore(testNo === '1' ? 'reading:test' : 'reading:test' + testNo, totalCorrect(), totalQ());
        document.getElementById('score').classList.remove('low');
        cur = 0; render();
    }
    render();

    // Swipe left/right to change set (not during a timed test, so nothing is skipped by accident)
    let sx = 0, sy = 0;
    const stageEl = document.getElementById('stage');
    stageEl.addEventListener('touchstart', e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
    stageEl.addEventListener('touchend', e => {
        if (testMode && !submitted) return;
        const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
        if (Math.abs(dx) > 110 && Math.abs(dx) > Math.abs(dy) * 2.5) {
            const n = cur + (dx < 0 ? 1 : -1);
            if (n >= 0 && n < sets.length) { cur = n; render(); }
        }
    }, { passive: true });
</script>
</body>
</html>
