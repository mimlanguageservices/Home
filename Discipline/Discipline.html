<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1f2933">
<title>Student Discipline</title>
<style>
  :root{
    --bg:#111827; --card:#1f2937; --card-2:#273244;
    --text:#f3f4f6; --muted:#9ca3af; --line:#374151;
    --warning:#d97706; --move:#7c3aed; --incident:#dc2626;
    --ok:#059669;
    --boy:#2563eb; --girl:#db2777;
    --boy-bg:#cfe4ff; --boy-bg-2:#b4d4ff;
    --girl-bg:#ffd9ec; --girl-bg-2:#ffc2e0;
    --gender-text:#1f2937;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap{max-width:520px; margin:0 auto; padding:16px;}

  header{
    display:flex; align-items:center; gap:10px;
    padding:6px 2px 14px;
  }
  header .back{
    border:0; background:var(--card); color:var(--text);
    width:38px; height:38px; border-radius:10px; font-size:20px;
    display:flex; align-items:center; justify-content:center;
  }
  header .back[hidden]{display:none;}
  header h1{font-size:17px; margin:0; font-weight:600; flex:1;}
  header .gear{
    border:0; background:transparent; color:var(--muted);
    font-size:20px; width:38px; height:38px;
  }
  .crumb{color:var(--muted); font-size:13px; padding:0 2px 12px;}

  .grid{display:flex; flex-direction:column; gap:12px;}

  .tile{
    border:0; text-align:left; width:100%;
    background:var(--card); color:var(--text);
    border-radius:14px; padding:18px 16px; font-size:18px; font-weight:600;
    display:flex; align-items:center; gap:14px;
    border:1px solid var(--line);
  }
  .tile:active{background:var(--card-2);}
  .tile .sub{display:block; font-size:13px; font-weight:400; color:var(--muted); margin-top:2px;}
  .tile.situations{border-color:var(--incident); border-left-width:4px;}

  .student-row{
    display:flex; align-items:center; gap:14px;
    background:var(--card); border:1px solid var(--line);
    border-radius:14px; padding:12px 14px; width:100%; text-align:left; color:var(--text);
  }
  .student-row:active{background:var(--card-2);}
  .student-row.boy{background:var(--boy-bg); color:var(--gender-text);}
  .student-row.girl{background:var(--girl-bg); color:var(--gender-text);}
  .student-row.boy:active{background:var(--boy-bg-2);}
  .student-row.girl:active{background:var(--girl-bg-2);}
  .student-row.boy .avatar{box-shadow:0 0 0 2px var(--boy);}
  .student-row.girl .avatar{box-shadow:0 0 0 2px var(--girl);}
  .avatar{
    width:64px; height:64px; border-radius:50%; object-fit:cover;
    background:var(--card-2); flex:none;
    display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; color:var(--muted);
  }
  .student-row .name{flex:1; font-weight:600; font-size:16px;}

  .search{
    width:100%; border:1px solid var(--line); background:var(--card);
    color:var(--text); border-radius:12px; padding:12px 14px; font-size:16px; margin-bottom:12px;
  }
  .search::placeholder{color:var(--muted);}

  .action-btn{
    border:0; width:100%; color:#fff;
    border-radius:16px; padding:26px 18px; font-size:22px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:6px;
  }
  .action-btn.move{background:var(--move);}
  .action-btn:active{filter:brightness(.9);}

  .profile{
    display:flex; align-items:center; gap:14px; margin-bottom:20px;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;
  }
  .profile .avatar{width:56px; height:56px; font-size:20px;}
  .profile .name{font-size:18px; font-weight:700;}
  .profile .status{font-size:13px; color:var(--muted); margin-top:3px;}

  /* situation menu */
  .group-title{
    font-size:12px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted); margin:18px 2px 8px;
  }
  .group-title:first-of-type{margin-top:0;}
  .sit-btn{
    border:1px solid var(--line); background:var(--card); color:var(--text);
    width:100%; text-align:left; border-radius:12px; padding:14px;
    font-size:15px; display:flex; gap:12px; align-items:flex-start;
  }
  .sit-btn:active{background:var(--card-2);}
  .sit-btn .code{font-weight:700; color:var(--incident); flex:none; min-width:30px;}
  .sit-btn.t2 .code{color:var(--warning);}

  /* situations log */
  .sit-card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:12px 14px; display:flex; gap:12px; align-items:flex-start;
  }
  .sit-card .avatar{width:48px; height:48px; font-size:15px;}
  .sit-card .body{flex:1; min-width:0;}
  .sit-card .who{font-weight:700; font-size:15px;}
  .sit-card .who .cls{font-weight:400; color:var(--muted); font-size:13px;}
  .sit-card .what{font-size:14px; margin-top:3px;}
  .sit-card .what b{color:var(--incident);}
  .sit-card .when{font-size:12px; color:var(--muted); margin-top:4px;}
  .sit-card .notes{font-size:13px; color:var(--muted); margin-top:6px; font-style:italic; word-break:break-word;}
  .pill{
    font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px;
    color:#fff; background:var(--line); flex:none; white-space:nowrap;
  }
  .pill.reported{background:var(--incident);}
  .pill.in-process{background:var(--warning);}
  .pill.resolved{background:var(--ok);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .chip{
    border:1px solid var(--line); background:transparent; color:var(--muted);
    border-radius:999px; padding:7px 13px; font-size:13px; font-weight:600;
  }
  .chip.on{background:var(--text); color:var(--bg); border-color:var(--text);}

  .msg{
    text-align:center; color:var(--muted); padding:40px 10px; font-size:15px;
  }

  /* toast */
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(120%);
    background:var(--ok); color:#fff; padding:14px 22px; border-radius:12px;
    font-weight:600; font-size:15px; transition:transform .25s ease; z-index:50;
    max-width:90vw; text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);}
  .toast.err{background:var(--incident);}

  /* dialogs */
  dialog{
    border:0; border-radius:16px; padding:20px; width:calc(100% - 32px); max-width:460px;
    background:var(--card); color:var(--text);
  }
  dialog::backdrop{background:rgba(0,0,0,.6);}
  dialog h2{margin:0 0 6px; font-size:17px;}
  dialog p{margin:0 0 14px; font-size:13px; color:var(--muted);}
  dialog input{
    width:100%; border:1px solid var(--line); background:var(--bg); color:var(--text);
    border-radius:10px; padding:11px 12px; font-size:14px; margin-bottom:14px;
  }
  dialog .row{display:flex; gap:10px; justify-content:flex-end;}
  dialog button{
    border:0; border-radius:10px; padding:10px 16px; font-size:14px; font-weight:600;
    background:var(--card-2); color:var(--text);
  }
  dialog button.primary{background:var(--move); color:#fff;}
  dialog button.danger{background:var(--incident); color:#fff;}
  dialog button[disabled]{opacity:.5;}
  #confirm h2{font-size:20px; text-align:center; margin-bottom:14px;}
  #confirm .profile{margin-bottom:14px; background:var(--bg);}
  #confirm .row button{flex:1; padding:14px; font-size:16px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="backBtn" hidden aria-label="Back">&#8592;</button>
    <h1 id="title">Student Discipline</h1>
    <button class="gear" id="gearBtn" aria-label="Settings">&#9881;</button>
  </header>
  <div class="crumb" id="crumb"></div>
  <div id="view"></div>
</div>

<div class="toast" id="toast"></div>

<dialog id="settings">
  <h2>Web App URL</h2>
  <p>Paste the Google Apps Script Web App URL you got after deploying <b>DisciplineScript.gs</b>.</p>
  <input id="urlInput" type="url" placeholder="https://script.google.com/macros/s/.../exec">
  <div class="row" style="justify-content:space-between;">
    <button id="lockBtn">Lock app</button>
    <span>
      <button id="cancelSettings">Cancel</button>
      <button class="primary" id="saveSettings">Save</button>
    </span>
  </div>
</dialog>

<dialog id="confirm">
  <h2>Are you sure?</h2>
  <div id="confirmBody"></div>
  <div class="row">
    <button id="confirmCancel">Cancel</button>
    <button class="danger" id="confirmOk">Confirm</button>
  </div>
</dialog>

<script>
/* ------------------------------------------------------------------
   CONFIG
   Paste your deployed Web App URL here, or leave blank and set it
   in the app via the gear icon (it is saved on the device).
------------------------------------------------------------------ */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbypVEbFCfSeu1ONvARs79N_9KhE46iOh3yPO7I4wJ_IK8b6G-495X3x6aM3rnERZHk2HA/exec";

/* The Situations tile is placed right after this class. */
const SITUATIONS_AFTER_CLASS = "8C";

/* The menu shown when a student is tapped. */
const SITUATION_TYPES = [
  { group:"Type 1", cls:"t1", items:[
    { code:"1.1", label:"Aggressive or inappropriate behavior" },
    { code:"1.2", label:"Theft, plagiarism, or academic fraud" },
    { code:"1.3", label:"Alcohol, tobacco, vaping, or drug use" },
    { code:"1.4", label:"Inappropriate sexual behavior" },
    { code:"1.5", label:"Failure to follow environmental policies" },
    { code:"1.6", label:"Failure to follow safety and tech protocols" },
    { code:"1.7", label:"Repeated disruption of teaching and learning (three times)" }
  ]},
  { group:"Type 2", cls:"t2", items:[
    { code:"2.A", label:"Repeated or systematic situations" },
    { code:"2.B", label:"Situations involving harm without incapacity" }
  ]}
];

/* Confirmation sound played when a situation is reported. */
const DING = new Audio("https://static.wixstatic.com/mp3/593d03_244b1a7fddcf4931957cde0d504d0354.mp3");
DING.preload = "auto";
function playDing(){
  try{ DING.currentTime = 0; DING.play().catch(function(){}); }catch(_){}
}

const state = {
  screen: "class",     // class -> student -> report ; class -> situations
  students: [],
  className: null,
  studentIdx: null,
  pending: null,       // situation item awaiting confirmation
  sending: false,
  loading: false,
  refreshing: false,
  cacheTs: 0,
  error: null,
  pinError: null,
  query: "",
  situations: null,    // null = never loaded
  sitLoading: false,
  sitError: null,
  sitFilter: "Open"
};

const els = {
  view: document.getElementById("view"),
  title: document.getElementById("title"),
  crumb: document.getElementById("crumb"),
  back: document.getElementById("backBtn"),
  gear: document.getElementById("gearBtn"),
  toast: document.getElementById("toast"),
  dialog: document.getElementById("settings"),
  urlInput: document.getElementById("urlInput"),
  confirm: document.getElementById("confirm"),
  confirmBody: document.getElementById("confirmBody"),
  confirmOk: document.getElementById("confirmOk")
};

function getUrl(){
  return (localStorage.getItem("disciplineUrl") || SCRIPT_URL || "").trim();
}
function getPin(){
  return (localStorage.getItem("disciplinePin") || "").trim();
}
function lockApp(){
  localStorage.removeItem("disciplinePin");
  state.screen = "pin";
  render();
}

/* Build a request URL with the shared params + PIN attached. */
function apiUrl(paramObj){
  const url = getUrl();
  const params = new URLSearchParams(paramObj);
  params.set("pin", getPin());
  return url + (url.includes("?") ? "&" : "?") + params.toString();
}

/* GET the script and parse JSON. A rejected PIN sends the user back
   to the PIN screen and resolves to null. */
async function api(paramObj){
  const res = await fetch(apiUrl(paramObj));
  const raw = await res.text();
  let data;
  try{ data = JSON.parse(raw); }
  catch(_){
    throw new Error("Server did not return JSON (HTTP " + res.status + "). " +
      "This usually means the Web App is asking for a Google login. " +
      "First 120 chars: " + raw.slice(0,120));
  }
  if(data.unauthorized){
    localStorage.removeItem("disciplinePin");
    state.screen = "pin";
    state.pinError = data.error || "Incorrect PIN.";
    render();
    return null;
  }
  if(!data.success) throw new Error(data.error || "Request failed");
  return data;
}

/* ---------- roster cache (instant load) ---------- */
const CACHE_KEY = "disciplineRoster";
function readCache(){
  try{ return JSON.parse(localStorage.getItem(CACHE_KEY) || "null"); }catch(_){ return null; }
}
function writeCache(students){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({ ts: Date.now(), students: students })); }catch(_){}
}

/* ---------- data ---------- */
async function loadRoster(){
  const url = getUrl();
  if(!url){ openSettings(); return; }
  if(!getPin()){ state.screen = "pin"; render(); return; }
  state.error = null;

  // 1. Paint immediately from the last saved list, if we have one.
  const cached = readCache();
  const haveCache = cached && Array.isArray(cached.students) && cached.students.length;
  if(haveCache){
    state.students = cached.students;
    state.cacheTs = cached.ts;
    state.loading = false;
    state.refreshing = true;
    if(state.screen === "pin") state.screen = "class";
  }else{
    state.loading = true;
  }
  render();

  // 2. Refresh from the server in the background.
  try{
    const data = await api({ mode:"roster" });
    if(!data){ state.loading = false; state.refreshing = false; return; }
    const fresh = data.students || [];
    if(fresh.length){
      state.students = fresh;
      state.cacheTs = Date.now();
      writeCache(fresh);
    }else if(!haveCache){
      state.error = "The script ran but returned 0 students. " +
        "The tab it read is probably not the roster tab — check ROSTER_SHEET_NAME in DisciplineScript.gs.";
    }
  }catch(err){
    if(haveCache){
      toast("Showing saved list — couldn't refresh", true);
    }else{
      state.error = err.message;
      state.students = [];
    }
  }
  state.loading = false;
  state.refreshing = false;
  render();
}

async function loadSituations(){
  state.sitLoading = true;
  state.sitError = null;
  render();
  try{
    const data = await api({ mode:"situations" });
    if(!data){ state.sitLoading = false; return; }
    state.situations = data.situations || [];
  }catch(err){
    state.sitError = err.message;
  }
  state.sitLoading = false;
  render();
}

/* Send the confirmed situation to the spreadsheet. */
async function submitReport(){
  const s = state.students[state.studentIdx];
  const item = state.pending;
  if(!s || !item || state.sending) return;
  state.sending = true;
  els.confirmOk.disabled = true;
  els.confirmOk.textContent = "Sending…";
  try{
    const data = await api({
      mode:"report", class:s.class || "", name:s.name, image:s.image || "",
      code:item.code, situation:item.label
    });
    if(data && !data.situation){
      throw new Error("the Apps Script is out of date — redeploy DisciplineScript.gs");
    }
    if(data){
      playDing();
      if(state.situations) state.situations.unshift(data.situation);
      toast("Reported " + item.code + " — " + firstName(s.name));
      els.confirm.close();
      state.screen = "student";
      state.studentIdx = null;
      render();
    }else{
      els.confirm.close();
    }
  }catch(err){
    toast("Not sent: " + err.message, true);
  }
  state.sending = false;
  state.pending = null;
  els.confirmOk.disabled = false;
  els.confirmOk.textContent = "Confirm";
}

/* ---------- screens ---------- */
function classes(){
  const set = [];
  state.students.forEach(s => { if(s.class && !set.includes(s.class)) set.push(s.class); });
  return set;
}

function render(){
  const locked = state.screen === "pin";
  els.back.hidden = locked || state.screen === "class";
  els.gear.style.visibility = locked ? "hidden" : "visible";
  els.crumb.textContent =
    locked ? "" :
    state.screen === "class" ? (state.refreshing ? "Updating list…" : "") :
    state.screen === "student" ? "Tap a student to report a situation" + (state.refreshing ? "   ·   updating…" : "") :
    state.screen === "report" ? "Choose the type of situation" :
    "";

  if(locked) return renderPin();

  if(state.loading){
    els.title.textContent = "Loading…";
    els.view.innerHTML = '<div class="msg">Fetching the student list for the first time…<br>' +
      'After this it opens instantly.</div>';
    return;
  }

  if(state.screen === "class")      return renderClasses();
  if(state.screen === "situations") return renderSituations();
  if(state.screen === "report")     return renderReport();
  return renderStudents();
}

function renderPin(){
  els.title.textContent = "Enter PIN";
  els.view.innerHTML =
    '<form id="pinForm" class="grid" style="margin-top:24px;">' +
      '<input class="search" id="pinInput" type="password" inputmode="numeric" ' +
        'autocomplete="off" placeholder="PIN" style="text-align:center; letter-spacing:6px; font-size:20px;">' +
      (state.pinError ? '<div class="msg" style="color:var(--incident); padding:4px 0;">' + esc(state.pinError) + '</div>' : '') +
      '<button class="action-btn move" type="submit">Unlock</button>' +
    '</form>';
  const input = document.getElementById("pinInput");
  input.focus({preventScroll:true});
  document.getElementById("pinForm").addEventListener("submit", e => {
    e.preventDefault();
    const v = input.value.trim();
    if(!v) return;
    localStorage.setItem("disciplinePin", v);
    state.pinError = null;
    state.screen = "class";
    loadRoster();
  });
}

function renderClasses(){
  els.title.textContent = "Choose a class";
  const list = classes();
  if(!list.length){
    els.view.innerHTML =
      '<div class="msg" style="text-align:left; word-break:break-word;">' +
        (state.error ? esc(state.error) : "No students found.") +
      '</div>' +
      '<button class="tile" onclick="loadRoster()">↻&nbsp; Retry</button>';
    return;
  }
  const sitTile =
    '<button class="tile situations" onclick="openSituations()">' +
      '<span>Situations<span class="sub">Reported cases and their process</span></span>' +
    '</button>';
  const tiles = list.map(c => {
    const n = state.students.filter(s => s.class === c).length;
    return '<button class="tile" onclick="pickClass(\'' + esc(c) + '\')">' +
             '<span>Class ' + esc(c) + '<span class="sub">' + n + ' students</span></span>' +
           '</button>';
  });
  const at = list.indexOf(SITUATIONS_AFTER_CLASS);
  tiles.splice(at === -1 ? tiles.length : at + 1, 0, sitTile);
  els.view.innerHTML = '<div class="grid">' + tiles.join("") + '</div>';
}

/* Sort order: boys first, then girls, then unspecified. */
function genderRank(s){ return s.gender === "boy" ? 0 : s.gender === "girl" ? 1 : 2; }

function renderStudents(){
  els.title.textContent = "Class " + state.className;
  const roster = state.students
    .filter(s => s.class === state.className)
    .filter(s => s.name.toLowerCase().includes(state.query.toLowerCase()))
    .sort((a,b) => (genderRank(a) - genderRank(b)) || a.name.localeCompare(b.name));

  const rows = roster.map(s => {
    const idx = state.students.indexOf(s);
    const g = s.gender === "boy" ? " boy" : s.gender === "girl" ? " girl" : "";
    return '<button class="student-row' + g + '" onclick="pickStudent(' + idx + ')">' +
             avatar(s) +
             '<span class="name">' + esc(s.name) + '</span>' +
           '</button>';
  }).join("");

  els.view.innerHTML =
    '<input class="search" id="q" placeholder="Search name…" value="' + esc(state.query) + '">' +
    '<div class="grid">' + (rows || '<div class="msg">No matches.</div>') + '</div>';

  const q = document.getElementById("q");
  q.addEventListener("input", e => { state.query = e.target.value; renderStudents(); });
  if(!skipSearchFocus){
    q.focus({preventScroll:true});
    const len = q.value.length; q.setSelectionRange(len,len);
  }
  skipSearchFocus = false;
}

function renderReport(){
  const s = state.students[state.studentIdx];
  els.title.textContent = "Report a situation";
  let html =
    '<div class="profile">' + avatar(s) +
      '<div><div class="name">' + esc(s.name) + '</div>' +
      '<div class="status">Class ' + esc(s.class) + '</div></div>' +
    '</div>';
  SITUATION_TYPES.forEach(t => {
    html += '<div class="group-title">' + esc(t.group) + '</div><div class="grid" style="gap:8px;">';
    t.items.forEach(it => {
      html += '<button class="sit-btn ' + t.cls + '" onclick="askConfirm(\'' + it.code + '\')">' +
                '<span class="code">' + esc(it.code) + '</span><span>' + esc(it.label) + '</span>' +
              '</button>';
    });
    html += '</div>';
  });
  els.view.innerHTML = html;
  window.scrollTo(0,0);
}

/* "Open" = anything not yet Resolved. */
function isResolved(x){ return (x.status || "").toLowerCase() === "resolved"; }

function renderSituations(){
  els.title.textContent = "Situations";
  if(state.sitLoading && !state.situations){
    els.view.innerHTML = '<div class="msg">Loading situations…</div>';
    return;
  }
  if(state.sitError && !state.situations){
    els.view.innerHTML =
      '<div class="msg" style="text-align:left; word-break:break-word;">' + esc(state.sitError) + '</div>' +
      '<button class="tile" onclick="loadSituations()">↻&nbsp; Retry</button>';
    return;
  }
  const all = state.situations || [];
  const open = all.filter(x => !isResolved(x));
  const shown =
    state.sitFilter === "Open" ? open :
    state.sitFilter === "Resolved" ? all.filter(isResolved) : all;

  const chip = (name, n) =>
    '<button class="chip' + (state.sitFilter === name ? ' on' : '') + '" onclick="setSitFilter(\'' + name + '\')">' +
      name + ' (' + n + ')</button>';

  const cards = shown.map(x => {
    const st = x.status || "Reported";
    return '<div class="sit-card">' +
             avatar(x) +
             '<div class="body">' +
               '<div class="who">' + esc(x.name) + ' <span class="cls">· ' + esc(x.class) + '</span></div>' +
               '<div class="what"><b>' + esc(x.code) + '</b> ' + esc(x.situation) + '</div>' +
               '<div class="when">' + esc(fmtDate(x.date)) + '</div>' +
               (x.notes ? '<div class="notes">' + esc(x.notes) + '</div>' : '') +
             '</div>' +
             '<span class="pill ' + slug(st) + '">' + esc(st) + '</span>' +
           '</div>';
  }).join("");

  els.crumb.textContent = state.sitLoading ? "Updating…" : "Status is updated in the Situations tab of the spreadsheet";
  els.view.innerHTML =
    '<div class="filters">' +
      chip("Open", open.length) + chip("Resolved", all.length - open.length) + chip("All", all.length) +
    '</div>' +
    '<div class="grid">' + (cards || '<div class="msg">Nothing here.</div>') + '</div>';
}

/* ---------- actions ---------- */
function pickClass(c){ state.className = c; state.query = ""; state.screen = "student"; render(); }
function pickStudent(idx){ state.studentIdx = idx; state.screen = "report"; render(); }
function openSituations(){ state.screen = "situations"; loadSituations(); }
function setSitFilter(f){ state.sitFilter = f; render(); }
function goBack(){
  if(state.screen === "report"){ state.screen = "student"; state.studentIdx = null; skipSearchFocus = true; }
  else if(state.screen === "student"){ state.screen = "class"; state.className = null; }
  else if(state.screen === "situations"){ state.screen = "class"; }
  render();
}

/* When true, the next student-list render won't grab the search box
   (so coming back from a report doesn't pop the phone keyboard open). */
let skipSearchFocus = false;

function askConfirm(code){
  const s = state.students[state.studentIdx];
  let item = null;
  SITUATION_TYPES.forEach(t => t.items.forEach(it => { if(it.code === code) item = it; }));
  if(!s || !item) return;
  state.pending = item;
  els.confirmBody.innerHTML =
    '<div class="profile">' + avatar(s) +
      '<div><div class="name">' + esc(s.name) + '</div>' +
      '<div class="status">Class ' + esc(s.class) + '</div></div>' +
    '</div>' +
    '<p style="font-size:15px; color:var(--text); text-align:center; margin-bottom:18px;">' +
      '<b style="color:var(--incident);">' + esc(item.code) + '</b> ' + esc(item.label) +
    '</p>';
  els.confirm.showModal();
}

/* ---------- helpers ---------- */
function firstName(n){ return (n || "").split(" ")[0]; }
function initials(n){ return (n||"?").split(" ").map(p=>p[0]).slice(0,2).join("").toUpperCase(); }
function slug(s){ return String(s).toLowerCase().trim().replace(/\s+/g,"-"); }
function fmtDate(iso){
  const d = new Date(iso);
  if(isNaN(d)) return iso || "";
  return d.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short", year:"numeric" }) +
         " · " + d.toLocaleTimeString(undefined, { hour:"numeric", minute:"2-digit" });
}
function avatar(s){
  if(s.image){
    return '<img class="avatar" src="' + esc(s.image) + '" alt="" ' +
      'onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),{className:\'avatar\',textContent:\'' + initials(s.name) + '\'}))">';
  }
  return '<div class="avatar">' + initials(s.name) + '</div>';
}
function esc(str){
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
let toastTimer;
function toast(text, isErr){
  els.toast.textContent = text;
  els.toast.className = "toast show" + (isErr ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { els.toast.className = "toast" + (isErr ? " err" : ""); }, 2600);
}

/* ---------- dialogs ---------- */
function openSettings(){
  els.urlInput.value = getUrl();
  els.dialog.showModal();
}
document.getElementById("gearBtn").addEventListener("click", openSettings);
document.getElementById("cancelSettings").addEventListener("click", () => els.dialog.close());
document.getElementById("lockBtn").addEventListener("click", () => {
  els.dialog.close();
  lockApp();
});
document.getElementById("saveSettings").addEventListener("click", () => {
  const v = els.urlInput.value.trim();
  if(v) localStorage.setItem("disciplineUrl", v);
  els.dialog.close();
  loadRoster();
});
document.getElementById("confirmCancel").addEventListener("click", () => {
  if(state.sending) return;
  state.pending = null;
  els.confirm.close();
});
els.confirmOk.addEventListener("click", submitReport);
els.confirm.addEventListener("cancel", e => { if(state.sending) e.preventDefault(); });
els.back.addEventListener("click", goBack);

/* Old 3-strike flags are no longer used. */
localStorage.removeItem("disciplineFlags");

/* ---------- go ---------- */
if(getPin()){
  loadRoster();
}else{
  state.screen = "pin";
  render();
}
</script>
</body>
</html>
