<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Real World English 8</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem 2.5rem;
    }

    /* ── TV / big-screen display mode (Silent Starter, Circle Time) ── */
    body.tv-mode {
      height: 100vh;
      min-height: 0;
      padding: 1.4rem 2.5rem 1.8rem;
      overflow: hidden;
    }

    body.tv-mode h1 {
      font-size: clamp(1.3rem, 2.4vmin, 1.8rem);
      margin-bottom: 0.15rem;
    }

    body.tv-mode #subtitle {
      font-size: clamp(0.8rem, 1.4vmin, 1rem);
      margin-bottom: 1rem;
    }

    body.tv-mode .resource-list {
      flex: 1;
      min-height: 0;
      width: 100%;
      max-width: none;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    body.tv-mode .resource-card {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 1.5rem 6rem;
    }

    body.tv-mode .resource-card .resource-text {
      width: 100%;
    }

    body.tv-mode .resource-title {
      font-size: clamp(1.8rem, 5.2vmin, 3.6rem);
      line-height: 1.35;
      text-wrap: balance;
    }

    body.tv-mode .shuffle-btn {
      width: 3.4rem;
      height: 3.4rem;
      top: 1.4rem;
      left: 1.6rem;
    }

    body.tv-mode .shuffle-btn svg {
      width: 24px;
      height: 24px;
    }

    body.tv-mode .letter-stage {
      flex: 1;
      min-height: 0;
    }

    /* ── Processing: floating SHICKEL letters ── */
    .letter-stage {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(0.6rem, 2.4vw, 1.8rem);
    }

    .letter-btn {
      font-family: inherit;
      font-weight: 800;
      font-size: clamp(2.6rem, 10vmin, 6.5rem);
      color: #3b82f6;
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.2rem 0.4rem;
      line-height: 1;
      animation: letter-float 3.4s ease-in-out infinite;
      transition: color 0.15s ease, transform 0.15s ease;
    }

    .letter-btn:hover,
    .letter-btn:focus-visible {
      color: #1d4ed8;
      transform: scale(1.1);
      animation-play-state: paused;
    }

    @keyframes letter-float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-16px); }
    }

    @media (prefers-reduced-motion: reduce) {
      .letter-btn { animation: none; }
    }

    h1 {
      font-size: 1.6rem;
      color: #334155;
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    #subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* ── Hover-out sidebar ── */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 14px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      overflow: hidden;
      transition: width 0.18s ease, box-shadow 0.18s ease;
      z-index: 40;
      padding-top: 1.4rem;
    }

    .sidebar:hover,
    .sidebar:focus-within {
      width: 230px;
      box-shadow: 6px 0 24px rgba(15, 23, 42, 0.12);
    }

    .sidebar-handle {
      position: absolute;
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 52px;
      border-radius: 4px;
      background: #cbd5e1;
      transition: opacity 0.15s ease;
    }

    .sidebar:hover .sidebar-handle,
    .sidebar:focus-within .sidebar-handle {
      opacity: 0;
    }

    .sidebar-inner {
      width: 230px;
      padding: 0 0.9rem;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .sidebar:hover .sidebar-inner,
    .sidebar:focus-within .sidebar-inner {
      opacity: 1;
    }

    .sidebar-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin: 0.3rem 0 0.7rem 0.7rem;
    }

    .sidebar-link {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      font: inherit;
      padding: 0.6rem 0.7rem;
      border-radius: 8px;
      color: #1e293b;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      white-space: nowrap;
      margin-bottom: 0.25rem;
    }

    .sidebar-link:hover { background: #eef2ff; color: #3b82f6; }

    .sidebar-link.active {
      background: #3b82f6;
      color: #fff;
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .breadcrumb .crumb {
      cursor: pointer;
      color: #3b82f6;
      font-weight: 600;
    }

    .breadcrumb .crumb.current {
      color: #334155;
      cursor: default;
      font-weight: 700;
    }

    .breadcrumb .sep { color: #cbd5e1; }

    .back-btn {
      font: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: #3b82f6;
      border: none;
      border-radius: 999px;
      padding: 0.65rem 1.6rem;
      margin-right: 0.75rem;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
      transition: background 0.15s, transform 0.15s;
    }

    .back-btn:hover { background: #2563eb; transform: translateX(-2px); }

    /* ── Grid of choice cards ── */
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      max-width: 900px;
      width: 100%;
    }

    .choice-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 1.4rem 1.8rem;
      min-width: 160px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      color: #1e293b;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
    }

    .choice-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border-color: #3b82f6;
    }

    /* ── Carousel of choice cards ── */
    .grid { max-width: 1100px; }

    .carousel {
      position: relative;
      width: 100%;
    }

    .carousel-track {
      display: flex;
      flex-wrap: wrap;
      gap: 1.4rem;
      justify-content: center;
      padding: 0.6rem 1rem 2rem;
    }

    .carousel .choice-card {
      flex: none;
      width: 220px;
      height: 280px;
      padding: 1.4rem 1rem;
      border: none;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      position: relative;
      overflow: hidden;
      background: linear-gradient(145deg, var(--c1), var(--c2));
      box-shadow: 0 10px 24px rgba(15, 23, 42, 0.18);
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
    }

    /* soft decorative circles */
    .carousel .choice-card::before,
    .carousel .choice-card::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.14);
    }
    .carousel .choice-card::before { width: 170px; height: 170px; top: -60px; right: -60px; }
    .carousel .choice-card::after  { width: 120px; height: 120px; bottom: -40px; left: -40px; }

    .carousel .choice-card:hover {
      transform: translateY(-5px) scale(1.03);
      box-shadow: 0 16px 32px rgba(15, 23, 42, 0.25);
    }

    /* custom picture cards: image fills the card, label sits on a dark strip */
    .carousel .choice-card.has-image {
      background-image: var(--img);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      justify-content: flex-end;
    }
    .carousel .choice-card.has-image.img-contain {
      background-size: contain;
      background-color: #fff;
    }
    .carousel .choice-card.has-image::before { display: none; }
    .carousel .choice-card.has-image::after {
      inset: auto 0 0 0;
      width: auto;
      height: 45%;
      border-radius: 0;
      background: linear-gradient(to top, rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0));
    }
    .carousel .choice-card.has-image .card-icon { display: none; }

    .carousel .card-icon {
      font-size: 4.6rem;
      line-height: 1;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.25));
      position: relative;
      z-index: 1;
    }

    .carousel .card-icon.card-num {
      font-size: 9rem;
      font-weight: 800;
      letter-spacing: -0.04em;
    }

    .carousel .card-label {
      font-size: 1.15rem;
      font-weight: 700;
      text-align: center;
      line-height: 1.25;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.25);
      position: relative;
      z-index: 1;
    }

    @media (max-width: 720px) {
      .carousel .choice-card { width: 180px; height: 240px; }
      .carousel-track { gap: 1rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      .carousel .choice-card { transition: none; }
    }

    /* ── Lesson row (final level) ── */
    .topic-row {
      background: #ffffff;
      border-radius: 12px;
      padding: 1rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 640px;
      flex-wrap: wrap;
    }

    .topic-row .topic-name {
      font-weight: 600;
      color: #1e293b;
    }

    .topic-row .order-tag {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-left: 0.5rem;
    }

    .topic-row .row-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: #2563eb; }

    .btn-assignment {
      background: #7c3aed;
    }
    .btn-assignment:hover { background: #6d28d9; }

    .topics-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      width: 100%;
      max-width: 560px;
    }

    /* ── Corner video (Silent Starter) ── */
    .corner-video {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 260px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      overflow: hidden;
      z-index: 20;
    }

    .corner-video iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
    }

    @media (max-width: 720px) {
      .corner-video {
        position: static;
        width: 100%;
        max-width: 400px;
        margin: 0 auto 1.5rem;
      }
    }

    /* ── Resource page (Silent Starter / Circle Time) ── */
    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      width: 100%;
      max-width: 620px;
    }

    .resource-card {
      position: relative;
      background: #ffffff;
      border-radius: 12px;
      padding: 1.1rem 1.4rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .resource-card.has-shuffle {
      padding-left: 3.8rem;
    }

    .resource-card .resource-text { min-width: 0; }

    .resource-card .resource-title {
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.2rem;
    }

    .resource-card .resource-desc {
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.4;
    }

    .shuffle-btn {
      position: absolute;
      top: 1.1rem;
      left: 1.4rem;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, transform 0.15s;
    }
    .shuffle-btn svg { width: 16px; height: 16px; }
    .shuffle-btn:hover {
      background: #3b82f6;
      color: #fff;
      border-color: #3b82f6;
    }
    .shuffle-btn:active { transform: rotate(180deg); }

    /* ── Loading / Error / Empty ── */
    #status {
      color: #64748b;
      font-size: 1rem;
      margin-top: 4rem;
      text-align: center;
      max-width: 500px;
    }
  </style>
</head>
<body>

  <h1 id="page-title">Real World English 8</h1>
  <p id="subtitle">Browse by book and lesson</p>

  <div class="breadcrumb" id="breadcrumb" style="display:none"></div>

  <div id="status">Loading curriculum data…</div>

  <div class="grid" id="grid" style="display:none"></div>
  <div class="topics-list" id="topics-list" style="display:none"></div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const SHEET_ID = '13vuBiyaM82zExzUjD4im2Zhoys_q3PjKt2Th3AiKFnE';
    // This site only shows rows whose Subject is this value
    const SUBJECT = 'Real World English';
    // ...and only this grade (matches any Grade value starting with this, e.g. "8th Grade")
    const GRADE_PREFIX = '8';

    // ============================================================

    // Sheet columns (header row, any order): Grade, Subject, Book, Lesson, Link
    let entries = [];
    let path = { subject: SUBJECT, book: null };

    async function loadSheet() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&cachebust=${Date.now()}`;
      try {
        const res  = await fetch(url);
        if (!res.ok) throw new Error('fetch failed');
        const text = await res.text();
        parseCSV(text);
      } catch (err) {
        document.getElementById('status').textContent =
          'Could not load curriculum sheet. Make sure it is shared as "Anyone with the link can view".';
      }
    }

    function parseCSVRow(row) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === '"') {
          if (inQuotes && row[i + 1] === '"') { current += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseCSV(text) {
      const rows = text.trim().split('\n').map(parseCSVRow);
      if (rows.length < 2) {
        showStatus('No curriculum entries found in the sheet yet.');
        return;
      }

      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = {
        grade:   header.findIndex(h => h.includes('grade')),
        subject: header.findIndex(h => h.includes('subject')),
        book:    header.findIndex(h => h.includes('book')),
        lesson:  header.findIndex(h => h.includes('lesson')),
        link:    header.findIndex(h => h.includes('link') || h.includes('url') || h.includes('slide')),
        assignment: header.findIndex(h => (h.includes('assignment') || h.includes('homework')) && !h.includes('type')),
        assignmentType: header.findIndex(h => h.includes('assignment') && h.includes('type')),
      };

      if (idx.grade === -1 || idx.subject === -1 || idx.book === -1 || idx.lesson === -1) {
        showStatus('Sheet is missing one of the required columns: Grade, Subject, Book, Lesson.');
        return;
      }

      entries = rows.slice(1)
        .filter(r => r[idx.grade] && r[idx.subject] && r[idx.book] && r[idx.lesson])
        .filter(r => r[idx.subject].trim().toLowerCase() === SUBJECT.toLowerCase())
        .filter(r => r[idx.grade].trim().startsWith(GRADE_PREFIX))
        .map(r => ({
          grade:   r[idx.grade],
          subject: r[idx.subject],
          book:    r[idx.book],
          lesson:  r[idx.lesson],
          link:    idx.link !== -1 ? (r[idx.link] || '') : '',
          assignment: idx.assignment !== -1 ? (r[idx.assignment] || '') : '',
          assignmentType: idx.assignmentType !== -1 ? (r[idx.assignmentType] || '') : '',
        }));

      if (entries.length === 0) {
        showStatus('No curriculum entries found in the sheet yet.');
        return;
      }

      document.getElementById('status').style.display = 'none';
      render();
    }

    function showStatus(msg) {
      const el = document.getElementById('status');
      el.style.display = '';
      el.textContent = msg;
    }

    function uniqueSorted(values) {
      return [...new Set(values)].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    // Lesson numbers look like "7.1", "7.2", "10.1" — sort numerically when possible
    function sortLessons(a, b) {
      const na = parseFloat(a.lesson);
      const nb = parseFloat(b.lesson);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return a.lesson.localeCompare(b.lesson, undefined, { numeric: true });
    }

    function hideAllPanels() {
      document.getElementById('breadcrumb').style.display = 'none';
      document.getElementById('status').style.display = 'none';
      document.getElementById('grid').style.display = 'none';
      document.getElementById('topics-list').style.display = 'none';
    }

    function render() {
      hideAllPanels();

      const grid = document.getElementById('grid');
      const topicsList = document.getElementById('topics-list');
      grid.innerHTML = '';
      topicsList.innerHTML = '';

      renderBreadcrumb();

      if (!path.book) {
        const books = uniqueSorted(
          entries.map(e => e.book)
        );
        renderCarousel(grid, books, b => { path.book = b; render(); });
        return;
      }

      // Final level: list lessons for grade + subject + book
      let lessons = entries.filter(e =>
        e.book === path.book
      );
      lessons.sort(sortLessons);

      lessons.forEach(l => {
        const row = document.createElement('div');
        row.className = 'topic-row';

        const name = document.createElement('span');
        name.className = 'topic-name';
        name.textContent = `Lesson ${l.lesson}`;
        row.appendChild(name);

        const actions = document.createElement('div');
        actions.className = 'row-actions';

        if (l.link) {
          const link = document.createElement('a');
          link.className = 'btn';
          link.href = l.link;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Open Slides ↗';
          actions.appendChild(link);
        } else {
          const missing = document.createElement('span');
          missing.className = 'order-tag';
          missing.textContent = 'No slides yet';
          actions.appendChild(missing);
        }

        if (l.assignment) {
          const assignment = document.createElement('a');
          assignment.className = 'btn btn-assignment';
          assignment.href = l.assignment;
          assignment.target = '_blank';
          assignment.rel = 'noopener noreferrer';
          assignment.textContent = (l.assignmentType ? `${l.assignmentType} Assignment` : 'Open Assignment') + ' ↗';
          actions.appendChild(assignment);
        }

        row.appendChild(actions);
        topicsList.appendChild(row);
      });

      topicsList.style.display = 'flex';
    }

    // ── Carousel cards: emoji + gradient picked from the label (no image downloads) ──
    const CARD_THEMES = [
      ['toefl', '🎓'], ['ielts', '🌐'], ['impact', '💥'], ['oral', '🗣️'], ['speaking', '🎤'],
      ['listening', '🎧'], ['writing', '✍️'], ['reading', '📖'], ['real world', '🌍'],
      ['grammar', '📝'], ['vocab', '🔠'], ['phonics', '🔤'], ['math', '➗'], ['science', '🔬'],
      ['social', '🌎'], ['art', '🎨'], ['music', '🎵'], ['conversation', '💬'], ['business', '💼'],
      ['explorer', '🧭'], ['english', '🇬🇧'], ['grade', '🏫'],
    ];

    // Custom pictures by label (lowercase). Falls back to emoji + gradient if the image fails to load.
    const CARD_IMAGES = {
      'real world english': { url: 'https://i.pinimg.com/474x/64/49/dd/6449dda31452870e898a43c862ddc291.jpg?nii=t' },
      'great writing': { url: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRe3BzvURdCaHJnxhIdlboGuG1ON5WboXTO7nzg8W6ezw&s=10' },
      'impact 4': { url: 'https://m.media-amazon.com/images/I/61DvKUVklPL._AC_UF1000,1000_QL80_.jpg' },
      'oral english': { url: 'https://img.magnific.com/premium-vector/concept-learning-italian-italian-language-course-language-school_677161-718.jpg?semt=ais_hybrid&w=740&q=80' },
      'reading explorer': { url: 'https://images.cdn2.buscalibre.com/fit-in/360x360/89/ff/89ffc22cf43b98ff0e136abbcdb09cbe.jpg' },
      'toefl junior': { url: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSHDOvemcPVpziH08HiaOsdU-px4_fe_wK12fMm8MmRLA&s=10' },
      'virtues': { url: 'https://study.com/cimages/multimages/16/choice_theory_infographic_450pxe19f08ea-0932-48be-a71f-1c6977c49e55.png', fit: 'contain' },
    };

    function applyCardImage(card, label) {
      // Prefix match, so "Reading Explorer 2" also picks up the "reading explorer" picture
      const l = label.trim().toLowerCase();
      const key = Object.keys(CARD_IMAGES).find(k => l === k || l.startsWith(k + ' '));
      const img = key && CARD_IMAGES[key];
      if (!img) return;
      const probe = new Image();
      probe.onload = () => {
        card.style.setProperty('--img', `url("${img.url}")`);
        card.classList.add('has-image');
        if (img.fit === 'contain') card.classList.add('img-contain');
      };
      probe.src = img.url;
    }

    function cardTheme(label) {
      const l = label.toLowerCase();
      const hit = CARD_THEMES.find(([k]) => l.includes(k));
      let h = 0;
      for (let i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) % 360;
      return {
        icon: hit ? hit[1] : (/^\d+/.test(l) ? '🏫' : '📚'),
        c1: `hsl(${h}, 75%, 58%)`,
        c2: `hsl(${(h + 40) % 360}, 70%, 42%)`,
      };
    }

    function renderCarousel(container, labels, onPick) {
      container.innerHTML = '';

      const wrap = document.createElement('div');
      wrap.className = 'carousel';
      const track = document.createElement('div');
      track.className = 'carousel-track';

      labels.forEach(label => {
        const t = cardTheme(label);
        const card = document.createElement('div');
        card.className = 'choice-card';
        card.tabIndex = 0;
        card.setAttribute('role', 'button');
        card.style.setProperty('--c1', t.c1);
        card.style.setProperty('--c2', t.c2);
        card.innerHTML = '<div class="card-icon"></div><div class="card-label"></div>';
        const icon = card.querySelector('.card-icon');
        const gradeNum = label.match(/^(\d+)(?:st|nd|rd|th)?\s*grade/i);
        icon.textContent = gradeNum ? gradeNum[1] : t.icon;
        if (gradeNum) icon.classList.add('card-num');
        card.querySelector('.card-label').textContent = label;
        applyCardImage(card, label);
        card.onclick = () => onPick(label);
        card.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); onPick(label); } };
        track.appendChild(card);
      });

      wrap.appendChild(track);
      container.appendChild(wrap);
      container.style.display = 'flex';
    }

    // Step up one level: lessons → books → subjects → grades
    function canGoBack() { return !!path.book; }

    function goBack() { path.book = null; render(); }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      bc.innerHTML = '';
      bc.style.display = 'flex';

      if (canGoBack()) {
        const back = document.createElement('button');
        back.className = 'back-btn';
        back.textContent = '← Back';
        back.onclick = goBack;
        bc.appendChild(back);
      }

      if (path.book) {
        const home = document.createElement('span');
        home.className = 'crumb';
        home.textContent = 'All Books';
        home.onclick = () => { path.book = null; render(); };
        bc.appendChild(home);
        bc.appendChild(sep());
        const bookCrumb = document.createElement('span');
        bookCrumb.className = 'crumb current';
        bookCrumb.textContent = path.book;
        bc.appendChild(bookCrumb);
      }
    }

    function sep() {
      const s = document.createElement('span');
      s.className = 'sep';
      s.textContent = '›';
      return s;
    }

    loadSheet();
  </script>
</body>
</html>
