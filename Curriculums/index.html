<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Curriculums</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 2rem 1.5rem 4rem 2.5rem;
    }

    h1 {
      font-size: 1.6rem;
      color: #334155;
      margin-bottom: 0.4rem;
      letter-spacing: 0.02em;
    }

    #subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 2rem;
      text-align: center;
    }

    /* ── Hover-out sidebar ── */
    .sidebar {
      position: fixed;
      top: 0;
      left: 0;
      height: 100vh;
      width: 14px;
      background: #ffffff;
      border-right: 1px solid #e2e8f0;
      overflow: hidden;
      transition: width 0.18s ease, box-shadow 0.18s ease;
      z-index: 40;
      padding-top: 1.4rem;
    }

    .sidebar:hover,
    .sidebar:focus-within {
      width: 230px;
      box-shadow: 6px 0 24px rgba(15, 23, 42, 0.12);
    }

    .sidebar-handle {
      position: absolute;
      left: 5px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 52px;
      border-radius: 4px;
      background: #cbd5e1;
      transition: opacity 0.15s ease;
    }

    .sidebar:hover .sidebar-handle,
    .sidebar:focus-within .sidebar-handle {
      opacity: 0;
    }

    .sidebar-inner {
      width: 230px;
      padding: 0 0.9rem;
      opacity: 0;
      transition: opacity 0.12s ease;
    }

    .sidebar:hover .sidebar-inner,
    .sidebar:focus-within .sidebar-inner {
      opacity: 1;
    }

    .sidebar-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin: 0.3rem 0 0.7rem 0.7rem;
    }

    .sidebar-link {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      font: inherit;
      padding: 0.6rem 0.7rem;
      border-radius: 8px;
      color: #1e293b;
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      white-space: nowrap;
      margin-bottom: 0.25rem;
    }

    .sidebar-link:hover { background: #eef2ff; color: #3b82f6; }

    .sidebar-link.active {
      background: #3b82f6;
      color: #fff;
    }

    /* ── Breadcrumb ── */
    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 1.6rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .breadcrumb .crumb {
      cursor: pointer;
      color: #3b82f6;
      font-weight: 600;
    }

    .breadcrumb .crumb.current {
      color: #334155;
      cursor: default;
      font-weight: 700;
    }

    .breadcrumb .sep { color: #cbd5e1; }

    /* ── Grid of choice cards ── */
    .grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      max-width: 900px;
      width: 100%;
    }

    .choice-card {
      background: #ffffff;
      border-radius: 14px;
      padding: 1.4rem 1.8rem;
      min-width: 160px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      cursor: pointer;
      text-align: center;
      font-weight: 600;
      color: #1e293b;
      transition: transform 0.15s, box-shadow 0.15s;
      border: 2px solid transparent;
    }

    .choice-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border-color: #3b82f6;
    }

    /* ── Lesson row (final level) ── */
    .topic-row {
      background: #ffffff;
      border-radius: 12px;
      padding: 1rem 1.4rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 640px;
      flex-wrap: wrap;
    }

    .topic-row .topic-name {
      font-weight: 600;
      color: #1e293b;
    }

    .topic-row .order-tag {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-left: 0.5rem;
    }

    .topic-row .row-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .btn {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.5rem 1.1rem;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      white-space: nowrap;
    }
    .btn:hover { background: #2563eb; }

    .btn-assignment {
      background: #7c3aed;
    }
    .btn-assignment:hover { background: #6d28d9; }

    .topics-list {
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      width: 100%;
      max-width: 560px;
    }

    /* ── Corner video (Silent Starter) ── */
    .corner-video {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 260px;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
      overflow: hidden;
      z-index: 20;
    }

    .corner-video iframe {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
    }

    @media (max-width: 720px) {
      .corner-video {
        position: static;
        width: 100%;
        max-width: 400px;
        margin: 0 auto 1.5rem;
      }
    }

    /* ── Resource page (Silent Starter / Circle Time) ── */
    .resource-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
      width: 100%;
      max-width: 620px;
    }

    .resource-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 1.1rem 1.4rem;
      box-shadow: 0 4px 14px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .resource-card .resource-text { min-width: 0; }

    .resource-card .resource-title {
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 0.2rem;
    }

    .resource-card .resource-desc {
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.4;
    }

    /* ── Loading / Error / Empty ── */
    #status {
      color: #64748b;
      font-size: 1rem;
      margin-top: 4rem;
      text-align: center;
      max-width: 500px;
    }
  </style>
</head>
<body>

  <nav class="sidebar" id="sidebar" aria-label="More options">
    <div class="sidebar-handle"></div>
    <div class="sidebar-inner">
      <p class="sidebar-label">Curriculums</p>
      <button class="sidebar-link" id="nav-curriculum">Browse Curriculum</button>
      <p class="sidebar-label">Classroom Routines</p>
      <button class="sidebar-link" id="nav-silent-starter">Silent Starter</button>
      <button class="sidebar-link" id="nav-circle-time">Circle Time</button>
    </div>
  </nav>

  <div class="corner-video" id="corner-video" style="display:none">
    <iframe src="" id="corner-video-frame" title="Silent Starter video" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
  </div>

  <h1 id="page-title">Curriculums</h1>
  <p id="subtitle">Browse by grade, subject, book, and lesson</p>

  <div class="breadcrumb" id="breadcrumb" style="display:none"></div>

  <div id="status">Loading curriculum data…</div>

  <div class="grid" id="grid" style="display:none"></div>
  <div class="topics-list" id="topics-list" style="display:none"></div>
  <div class="resource-list" id="resource-list" style="display:none"></div>

  <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const SHEET_ID = '13vuBiyaM82zExzUjD4im2Zhoys_q3PjKt2Th3AiKFnE';

    // Sidebar resource pages — each reads its own tab (by name) from the same sheet.
    // Tab columns (any order): Title, Link, Description
    const RESOURCE_PAGES = {
      'silent-starter': {
        label: 'Silent Starter',
        tab: 'Silent Starter',
        subtitle: 'Quiet warm-up routines to start any class',
        video: 'https://www.youtube.com/embed/fjkDiLu4UyI?start=3',
      },
      'circle-time': {
        label: 'Circle Time',
        tab: 'Circle-Time',
        subtitle: 'Group discussion & circle activities',
      },
    };
    // ============================================================

    // Sheet columns (header row, any order): Grade, Subject, Book, Lesson, Link
    let entries = [];
    let path = { grade: null, subject: null, book: null };

    let view = 'curriculum'; // 'curriculum' | 'silent-starter' | 'circle-time'
    const resourceCache = {}; // key -> parsed resource rows

    async function loadSheet() {
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&cachebust=${Date.now()}`;
      try {
        const res  = await fetch(url);
        if (!res.ok) throw new Error('fetch failed');
        const text = await res.text();
        parseCSV(text);
      } catch (err) {
        document.getElementById('status').textContent =
          'Could not load curriculum sheet. Make sure it is shared as "Anyone with the link can view".';
      }
    }

    function parseCSVRow(row) {
      const result = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < row.length; i++) {
        const ch = row[i];
        if (ch === '"') {
          if (inQuotes && row[i + 1] === '"') { current += '"'; i++; }
          else inQuotes = !inQuotes;
        } else if (ch === ',' && !inQuotes) {
          result.push(current.trim());
          current = '';
        } else {
          current += ch;
        }
      }
      result.push(current.trim());
      return result;
    }

    function parseCSV(text) {
      const rows = text.trim().split('\n').map(parseCSVRow);
      if (rows.length < 2) {
        showStatus('No curriculum entries found in the sheet yet.');
        return;
      }

      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = {
        grade:   header.findIndex(h => h.includes('grade')),
        subject: header.findIndex(h => h.includes('subject')),
        book:    header.findIndex(h => h.includes('book')),
        lesson:  header.findIndex(h => h.includes('lesson')),
        link:    header.findIndex(h => h.includes('link') || h.includes('url') || h.includes('slide')),
        assignment: header.findIndex(h => (h.includes('assignment') || h.includes('homework')) && !h.includes('type')),
        assignmentType: header.findIndex(h => h.includes('assignment') && h.includes('type')),
      };

      if (idx.grade === -1 || idx.subject === -1 || idx.book === -1 || idx.lesson === -1) {
        showStatus('Sheet is missing one of the required columns: Grade, Subject, Book, Lesson.');
        return;
      }

      entries = rows.slice(1)
        .filter(r => r[idx.grade] && r[idx.subject] && r[idx.book] && r[idx.lesson])
        .map(r => ({
          grade:   r[idx.grade],
          subject: r[idx.subject],
          book:    r[idx.book],
          lesson:  r[idx.lesson],
          link:    idx.link !== -1 ? (r[idx.link] || '') : '',
          assignment: idx.assignment !== -1 ? (r[idx.assignment] || '') : '',
          assignmentType: idx.assignmentType !== -1 ? (r[idx.assignmentType] || '') : '',
        }));

      if (entries.length === 0) {
        showStatus('No curriculum entries found in the sheet yet.');
        return;
      }

      document.getElementById('status').style.display = 'none';
      render();
    }

    async function loadResourceTab(key) {
      if (resourceCache[key]) return resourceCache[key];

      const page = RESOURCE_PAGES[key];
      const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(page.tab)}&cachebust=${Date.now()}`;

      const res = await fetch(url);
      if (!res.ok) throw new Error('fetch failed');
      const text = await res.text();
      const rows = text.trim().split('\n').map(parseCSVRow);

      if (rows.length < 2) {
        resourceCache[key] = [];
        return [];
      }

      const header = rows[0].map(h => h.trim().toLowerCase());
      const idx = {
        title: header.findIndex(h => h.includes('title') || h.includes('name') || h.includes('question')),
        link:  header.findIndex(h => h.includes('link') || h.includes('url')),
        desc:  header.findIndex(h => h.includes('desc')),
      };

      // Sheets with just a single column of text (e.g. one question per row) —
      // treat column A as the title since there's no dedicated header to match.
      if (idx.title === -1 && header.length === 1) idx.title = 0;

      const items = rows.slice(1)
        .filter(r => idx.title !== -1 && r[idx.title])
        .map(r => ({
          title: r[idx.title],
          link:  idx.link !== -1 ? (r[idx.link] || '') : '',
          desc:  idx.desc !== -1 ? (r[idx.desc] || '') : '',
        }));

      resourceCache[key] = items;
      return items;
    }

    function showStatus(msg) {
      const el = document.getElementById('status');
      el.style.display = '';
      el.textContent = msg;
    }

    function uniqueSorted(values) {
      return [...new Set(values)].sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    // Lesson numbers look like "7.1", "7.2", "10.1" — sort numerically when possible
    function sortLessons(a, b) {
      const na = parseFloat(a.lesson);
      const nb = parseFloat(b.lesson);
      if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
      return a.lesson.localeCompare(b.lesson, undefined, { numeric: true });
    }

    function setActiveNav() {
      document.getElementById('nav-curriculum').classList.toggle('active', view === 'curriculum');
      document.getElementById('nav-silent-starter').classList.toggle('active', view === 'silent-starter');
      document.getElementById('nav-circle-time').classList.toggle('active', view === 'circle-time');
    }

    function hideAllPanels() {
      document.getElementById('breadcrumb').style.display = 'none';
      document.getElementById('status').style.display = 'none';
      document.getElementById('grid').style.display = 'none';
      document.getElementById('topics-list').style.display = 'none';
      document.getElementById('resource-list').style.display = 'none';
    }

    function setCornerVideo(url) {
      const wrap  = document.getElementById('corner-video');
      const frame = document.getElementById('corner-video-frame');
      if (url) {
        frame.src = url;
        wrap.style.display = '';
      } else {
        frame.src = '';
        wrap.style.display = 'none';
      }
    }

    function goToCurriculum() {
      view = 'curriculum';
      setActiveNav();
      document.getElementById('page-title').textContent = 'Curriculums';
      document.getElementById('subtitle').textContent = 'Browse by grade, subject, book, and lesson';
      setCornerVideo(null);
      render();
    }

    async function goToResourcePage(key) {
      view = key;
      setActiveNav();
      const page = RESOURCE_PAGES[key];
      document.getElementById('page-title').textContent = page.label;
      document.getElementById('subtitle').textContent = page.subtitle;
      setCornerVideo(page.video || null);

      hideAllPanels();
      const status = document.getElementById('status');
      status.style.display = '';
      status.textContent = `Loading ${page.label}…`;

      try {
        const items = await loadResourceTab(key);
        renderResourceList(items, page);
      } catch (err) {
        status.textContent =
          `Could not load the "${page.tab}" tab. Make sure it exists on the sheet and is shared as "Anyone with the link can view".`;
      }
    }

    function renderResourceList(items, page) {
      const status = document.getElementById('status');
      const list = document.getElementById('resource-list');
      list.innerHTML = '';

      if (items.length === 0) {
        status.style.display = '';
        status.textContent = `No ${page.label} items added yet.`;
        list.style.display = 'none';
        return;
      }

      status.style.display = 'none';

      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'resource-card';

        const text = document.createElement('div');
        text.className = 'resource-text';
        text.innerHTML = `<div class="resource-title"></div><div class="resource-desc"></div>`;
        text.querySelector('.resource-title').textContent = item.title;
        text.querySelector('.resource-desc').textContent = item.desc;
        card.appendChild(text);

        if (item.link) {
          const link = document.createElement('a');
          link.className = 'btn';
          link.href = item.link;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Open ↗';
          card.appendChild(link);
        }

        list.appendChild(card);
      });

      list.style.display = 'flex';
    }

    function render() {
      if (view !== 'curriculum') return;

      hideAllPanels();

      const grid = document.getElementById('grid');
      const topicsList = document.getElementById('topics-list');
      grid.innerHTML = '';
      topicsList.innerHTML = '';

      renderBreadcrumb();

      if (!path.grade) {
        const grades = uniqueSorted(entries.map(e => e.grade));
        grades.forEach(g => {
          const card = document.createElement('div');
          card.className = 'choice-card';
          card.textContent = g;
          card.onclick = () => { path.grade = g; path.subject = null; path.book = null; render(); };
          grid.appendChild(card);
        });
        grid.style.display = 'flex';
        return;
      }

      if (!path.subject) {
        const subjects = uniqueSorted(
          entries.filter(e => e.grade === path.grade).map(e => e.subject)
        );
        subjects.forEach(s => {
          const card = document.createElement('div');
          card.className = 'choice-card';
          card.textContent = s;
          card.onclick = () => { path.subject = s; path.book = null; render(); };
          grid.appendChild(card);
        });
        grid.style.display = 'flex';
        return;
      }

      if (!path.book) {
        const books = uniqueSorted(
          entries.filter(e => e.grade === path.grade && e.subject === path.subject).map(e => e.book)
        );
        books.forEach(b => {
          const card = document.createElement('div');
          card.className = 'choice-card';
          card.textContent = b;
          card.onclick = () => { path.book = b; render(); };
          grid.appendChild(card);
        });
        grid.style.display = 'flex';
        return;
      }

      // Final level: list lessons for grade + subject + book
      let lessons = entries.filter(e =>
        e.grade === path.grade && e.subject === path.subject && e.book === path.book
      );
      lessons.sort(sortLessons);

      lessons.forEach(l => {
        const row = document.createElement('div');
        row.className = 'topic-row';

        const name = document.createElement('span');
        name.className = 'topic-name';
        name.textContent = `Lesson ${l.lesson}`;
        row.appendChild(name);

        const actions = document.createElement('div');
        actions.className = 'row-actions';

        if (l.link) {
          const link = document.createElement('a');
          link.className = 'btn';
          link.href = l.link;
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.textContent = 'Open Slides ↗';
          actions.appendChild(link);
        } else {
          const missing = document.createElement('span');
          missing.className = 'order-tag';
          missing.textContent = 'No slides yet';
          actions.appendChild(missing);
        }

        if (l.assignment) {
          const assignment = document.createElement('a');
          assignment.className = 'btn btn-assignment';
          assignment.href = l.assignment;
          assignment.target = '_blank';
          assignment.rel = 'noopener noreferrer';
          assignment.textContent = (l.assignmentType ? `${l.assignmentType} Assignment` : 'Open Assignment') + ' ↗';
          actions.appendChild(assignment);
        }

        row.appendChild(actions);
        topicsList.appendChild(row);
      });

      topicsList.style.display = 'flex';
    }

    function renderBreadcrumb() {
      const bc = document.getElementById('breadcrumb');
      bc.innerHTML = '';
      bc.style.display = 'flex';

      const home = document.createElement('span');
      home.className = 'crumb' + (path.grade ? '' : ' current');
      home.textContent = 'All Grades';
      home.onclick = () => { path.grade = null; path.subject = null; path.book = null; render(); };
      bc.appendChild(home);

      if (path.grade) {
        bc.appendChild(sep());
        const gradeCrumb = document.createElement('span');
        gradeCrumb.className = 'crumb' + (path.subject ? '' : ' current');
        gradeCrumb.textContent = path.grade;
        gradeCrumb.onclick = () => { path.subject = null; path.book = null; render(); };
        bc.appendChild(gradeCrumb);
      }

      if (path.subject) {
        bc.appendChild(sep());
        const subjectCrumb = document.createElement('span');
        subjectCrumb.className = 'crumb' + (path.book ? '' : ' current');
        subjectCrumb.textContent = path.subject;
        subjectCrumb.onclick = () => { path.book = null; render(); };
        bc.appendChild(subjectCrumb);
      }

      if (path.book) {
        bc.appendChild(sep());
        const bookCrumb = document.createElement('span');
        bookCrumb.className = 'crumb current';
        bookCrumb.textContent = path.book;
        bc.appendChild(bookCrumb);
      }
    }

    function sep() {
      const s = document.createElement('span');
      s.className = 'sep';
      s.textContent = '›';
      return s;
    }

    document.getElementById('nav-curriculum').onclick = goToCurriculum;
    document.getElementById('nav-silent-starter').onclick = () => goToResourcePage('silent-starter');
    document.getElementById('nav-circle-time').onclick = () => goToResourcePage('circle-time');

    setActiveNav();
    loadSheet();
  </script>
</body>
</html>
